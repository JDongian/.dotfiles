# -*- conf -*-

# Host-specific font size is sourced from ~/.config/foot/font.ini, same split
# as hypr's monitor.conf. Keep this include ABOVE the sections below: foot
# processes includes in place, so a `font=` here after it would win.
include=~/.config/foot/font.ini

[bell]
urgent=yes

[colors-dark]
background=000000
foreground=ffffff
