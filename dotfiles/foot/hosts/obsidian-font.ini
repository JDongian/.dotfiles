# -*- conf -*-
# Obsidian (X1 Carbon 7th gen, 2560x1440 WQHD) — one step up from the 11px
# used elsewhere. gohufont is a BITMAP font shipping exactly two sizes,
# gohufont-11.pcf and gohufont-14.pcf, and home.nix turns antialiasing off
# for it. Any pixelsize between them would be scaled, not rendered, so 14 is
# the only bigger size that stays pixel-exact.
font=gohufont:pixelsize=14
