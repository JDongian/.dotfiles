# BACKGROUND
background {
    monitor =
    path = /home/joshua/Pictures/TahoeDawn.png
    blur_passes = 0
#     contrast = 0.8916
#     brightness = 0.8916
#     vibrancy = 0.8916
#     vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    grace = 0
    disable_loading_bar = true
    # hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 0
}

# AUTH
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = (Scan fingerprint to unlock)
    fingerprint:present_message = Scanning fingerprint
    fingerprint:retry_delay = 0
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a %b %-d")"
    color = rgba(216, 222, 233, 0.80)
    font_size = 24
    font_family = Inter
    position = 0, -130
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(216, 222, 233, 0.80)
    font_size = 96
    font_family = Inter Bold
    position = 0, -150
    halign = center
    valign = top
}

# USERNAME
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = Inter
    position = 0, 180
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 45
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(216, 222, 233, 0.3)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgb(216, 222, 233)
    fade_on_empty = false
    font_family = Inter
    placeholder_text = Touch ID or Enter Password
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}
