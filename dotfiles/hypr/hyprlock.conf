# BACKGROUND
background {
    monitor =
    path = /home/joshua/TahoeDawn.png
    blur_passes = 0
#     contrast = 0.8916
#     brightness = 0.8916
#     vibrancy = 0.8916
#     vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = true
    no_fade_out = true
    grace = 0
    disable_loading_bar = true
    # hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    fail_timeout = 0
}

# AUTH
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = (Scan fingerprint to unlock)
    fingerprint:present_message = Scanning fingerprint
    fingerprint:retry_delay = 0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(216, 222, 233, 0.80)
    font_size = 90
    font_family = OpenSans-Regular
    position = 0, 180
    halign = center
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%a %b %-d")"
    color = rgba(216, 222, 233, .80)
    font_size = 20
    font_family = OpenSans-Regular
    position = 0, 250
    halign = center
    valign = top
}

# USERNAME
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = OpenSans-Regular
    position = 0, -150
    halign = center
    valign = bottom
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = OpenSans-Regular
    placeholder_text = Touch ID or Enter Password
    hide_input = false
    position = 0, -100
    halign = center
    valign = bottom
}
