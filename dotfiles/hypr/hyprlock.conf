# BACKGROUND
# Points at a SYMLINK, not a real file. dotfiles/hypr/lockscreen-wallpaper.sh
# repoints it at the morning/day/evening/night variant of the Lake Tahoe set
# from hyprlock.service's ExecStartPre (home.nix), so the lock screen matches
# the time of day. hyprlock's `path` is a static hyprlang string — it does NOT
# support cmd[] substitution the way the label widgets do, which is why the
# selection happens outside the config.
background {
    monitor =
    path = /home/joshua/.local/share/wallpapers/tahoe-current.jpg
    blur_passes = 0
    # The four variants span a huge brightness range (midday blue sky vs a
    # starfield) while the overlay text is a single light colour. Knocking the
    # background down keeps the clock and the fingerprint prompt legible over
    # the bright `day` frame without washing out `night`.
    brightness = 0.75
#     contrast = 0.8916
#     vibrancy = 0.8916
#     vibrancy_darkness = 0.0
}

# GENERAL
general {
    # hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fractional_scaling = 2
    screencopy_mode = 0
    # How long a failed-auth message (incl. $FPRINTFAIL bad-read reasons) stays
    # on screen before the field resets. This is a GENERAL option — it does NOT
    # exist on input-field (hyprlock errors "config option
    # <input-field:fail_timeout> does not exist" if placed there).
    fail_timeout = 2000
}

# AUTH
auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    # ready_message shows only while the device is actually claimed and armed —
    # so if this text is ABSENT on the lock screen after a resume, the reader
    # never re-claimed (the failure mode we fight in hosts/tile/power.nix).
    fingerprint:ready_message = 󰈷 Scan fingerprint to unlock
    fingerprint:present_message = 󰈷 Scanning…
    fingerprint:retry_delay = 250
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%a %b %-d")"
    color = rgba(216, 222, 233, 0.80)
    font_size = 24
    font_family = Inter
    position = 0, -130
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(216, 222, 233, 0.80)
    font_size = 96
    font_family = Inter Bold
    position = 0, -150
    halign = center
    valign = top
}

# USERNAME
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.80)
    font_size = 18
    font_family = Inter
    position = 0, 180
    halign = center
    valign = bottom
}

# BATTERY (top-right). Reads sysfs directly — no daemon, no PATH dep.
# Glyphs are Nerd Fonts Material Design Icons battery_* series (10-step
# discharge + 10-step charge + unknown fallback). NotoSans Nerd Font Propo
# carries both Latin glyphs (for the percent) and the NF Private Use Area
# block, so a single label can render both without font fallback.
label {
    monitor =
    text = cmd[update:30000] c=$(cat /sys/class/power_supply/BAT0/capacity); s=$(cat /sys/class/power_supply/BAT0/status); if [ "$c" -ge 100 ]; then b=100; else b=$((c/10*10)); fi; case "$s:$b" in Charging:0) g="󰢟";; Charging:10) g="󰢜";; Charging:20) g="󰂆";; Charging:30) g="󰂇";; Charging:40) g="󰂈";; Charging:50) g="󰢝";; Charging:60) g="󰂉";; Charging:70) g="󰢞";; Charging:80) g="󰂊";; Charging:90) g="󰂋";; Charging:100) g="󰂅";; *:0) g="󰂎";; *:10) g="󰁺";; *:20) g="󰁻";; *:30) g="󰁼";; *:40) g="󰁽";; *:50) g="󰁾";; *:60) g="󰁿";; *:70) g="󰂀";; *:80) g="󰂁";; *:90) g="󰂂";; *:100) g="󰁹";; *) g="󰂑";; esac; printf "%s %s%%" "$g" "$c"
    color = rgba(216, 222, 233, 0.80)
    font_size = 16
    font_family = NotoSans Nerd Font Propo
    position = -20, -20
    halign = right
    valign = top
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 45
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(216, 222, 233, 0.3)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgb(216, 222, 233)
    # Feedback on the input-field outline / message line:
    #   check_color — outline while a password/fingerprint check is in flight
    #                 (amber "working on it")
    #   fail_color  — outline + message text on a rejected attempt (red)
    #   fail_text   — the message shown on failure. $FPRINTFAIL surfaces the
    #                 fprintd rejection reason; $ATTEMPTS the password attempt
    #                 count. The dedicated $FPRINTPROMPT label above carries the
    #                 live touch feedback; this line is the failure echo.
    check_color = rgba(235, 203, 139, 0.9)
    fail_color = rgba(191, 97, 106, 0.9)
    # Keep the outline red on a rejected attempt (fail_color) for a glanceable
    # signal, but the fingerprint text itself stays quiet white to match the
    # status line below the field. $FPRINTFAIL carries the reason on a bad read.
    fail_text = <span foreground="##d8dee9">$FPRINTFAIL</span>
    fade_on_empty = false
    font_family = Inter
    placeholder_text = Touch ID or Enter Password
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# FINGERPRINT STATUS — small white line UNDER the input field.
# $FPRINTPROMPT is hyprlock's LIVE fingerprint prompt; it updates on every
# sensor event, so touching the reader gives immediate feedback even for
# partial/bad reads. hyprlock 0.9.6 fills it with libfprint per-scan messages
# (Scanning fingerprint / Finger not centered - try again / Swipe too short /
# Could not match / Fingerprint did not match / device disconnected), and the
# armed-idle ready_message otherwise. Its ABSENCE = reader not armed.
# Sits just below the input field (input is valign=bottom at y=100, ~45px tall;
# this at y=48 clears its bottom edge). Deliberately small + white to read as a
# quiet status line, not a headline.
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(216, 222, 233, 0.75)
    font_size = 13
    font_family = Inter
    position = 0, 48
    halign = center
    valign = bottom
}
