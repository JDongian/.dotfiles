# Hypridle Configuration
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/
#
# This is the per-SESSION idle ladder (dim -> lock). It is the one piece of
# power management that does NOT live in hosts/tile/power.nix, because it is a
# home-manager dotfile, not a NixOS module. Everything else about power
# (lid/suspend/hibernate/resume/charge) lives there — keep the two in sync.
#
# All commands use absolute /run/current-system/sw/bin paths: hypridle runs as
# a systemd USER service with a minimal PATH that does NOT include the system
# profile, so bare names fail with "command not found" (seen 2026-06-04 with
# brightnessctl).
#
# DPMS-off was REMOVED 2026-06-04: a `dpms off` listener at 310s was crashing
# the whole Hyprland session while idle/unattended (SIGABRT, full session loss
# + greetd relogin). This matches a widely-reported Hyprland 0.55.x bug where
# powering the display off via DPMS races output teardown / trackpad-gesture
# handling. There is no fixed release yet (0.55.2 is latest), so the fix is to
# not call dpms off at all. The 150s dim-to-10% already darkens the panel; the
# only thing lost is fully cutting the backlight on the lock screen.

general {
    # Drives the hyprlock systemd user service (Restart=on-failure). Repeated
    # starts on an already-active unit no-op, so this is safe to call on every
    # lock-session signal.
    lock_cmd = systemctl --user start hyprlock.service
    before_sleep_cmd = /run/current-system/sw/bin/loginctl lock-session
    after_sleep_cmd = /run/current-system/sw/bin/hyprctl dispatch dpms on
}

# Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150                                # 2.5 minutes
    on-timeout = /run/current-system/sw/bin/brightnessctl -s set 10   # save current brightness and set to 10%
    on-resume = /run/current-system/sw/bin/brightnessctl -r           # restore previous brightness
}

# Turn off keyboard backlight after 2.5 minutes of inactivity
# (Commented out - uncomment if you have keyboard backlight)
# listener {
#     timeout = 150                                          # 2.5 minutes
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # restore keyboard backlight
# }

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300                                # 5 minutes
    on-timeout = /run/current-system/sw/bin/loginctl lock-session   # lock screen when timeout has passed
}

# NOTE: the "dpms off" listener that used to be here (timeout 310) was removed
# 2026-06-04 — it crashed the session. See the header at the top of this file.

# Suspend system after 10 minutes of inactivity
# (Commented out by default - uncomment to enable auto-suspend)
# listener {
#     timeout = 600                                # 10 minutes
#     on-timeout = systemctl suspend               # suspend pc
# }
