# Hypridle Configuration
# https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
}

# Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150                                # 2.5 minutes
    on-timeout = brightnessctl -s set 10         # save current brightness and set to 10%
    on-resume = brightnessctl -r                 # restore previous brightness
}

# Turn off keyboard backlight after 2.5 minutes of inactivity
# (Commented out - uncomment if you have keyboard backlight)
# listener {
#     timeout = 150                                          # 2.5 minutes
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # restore keyboard backlight
# }

# Lock screen after 5 minutes of inactivity
listener {
    timeout = 300                                # 5 minutes
    on-timeout = loginctl lock-session           # lock screen when timeout has passed
}

# Turn off screen after 5 minutes and 10 seconds of inactivity (10 seconds after lock)
listener {
    timeout = 310                                # 5 minutes 10 seconds
    on-timeout = hyprctl dispatch dpms off       # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on         # screen on when activity is detected after timeout has fired
}

# Suspend system after 10 minutes of inactivity
# (Commented out by default - uncomment to enable auto-suspend)
